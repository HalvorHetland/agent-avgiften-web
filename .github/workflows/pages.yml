# Auto-deploy til GitHub Pages ved hver push til main.
#
# Publiserer public/ som hele nettstedet, slik at telefonen ligger på rot og
# skjermen på /skjerm/. server.js og package.json blir liggende igjen i repoet,
# men serveres ikke — de er der for lokal kjøring og som reserve hvis standen
# senere skal flyttes til en ordentlig server.
name: Deploy til Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Én deploy om gangen. Køede kjøringer avbrytes ikke midt i.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GitHub Pages serverer med max-age=600. Uten cache-busting kan skjermen
      # kjøre ti minutter gammel kode etter en deploy på standdagen. Vi
      # stempler commit-SHA inn i script-taggene, så hver deploy er en ny URL.
      - name: Stemple versjon
        run: |
          VER="${GITHUB_SHA::7}"
          find public -name '*.html' -exec sed -i "s/__VER__/$VER/g" {} +
          echo "Stemplet $VER"
          grep -o 'src="[^"]*"' public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
