# Auto-deploy til GitHub Pages ved hver push til main.
#
# Publiserer public/ som hele nettstedet, slik at telefonen ligger på rot og
# skjermen på /skjerm/. server.js og package.json blir liggende igjen i repoet,
# men serveres ikke — de er der for lokal kjøring og som reserve hvis standen
# senere skal flyttes til en ordentlig server.
name: Deploy til Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Én deploy om gangen. Køede kjøringer avbrytes ikke midt i.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
