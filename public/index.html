<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<title>Agent-avgiften</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230a0a0a%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2216%22%20r%3D%228%22%20fill%3D%22%23f97316%22%2F%3E%3Ccircle%20cx%3D%2223%22%20cy%3D%2216%22%20r%3D%223%22%20fill%3D%22%234ade80%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  html{color-scheme:dark}
  @media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
  [role=button]:focus-visible{outline:2px solid #818cf8;outline-offset:3px}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#0a0a0a;color:#ededed;
    font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  a{color:#4ade80}
  a:hover{color:#86efac}

  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .disp{font-family:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;letter-spacing:-0.02em}
  .lbl{font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#8a8a8a;font-weight:600}
  .kol{display:flex;flex-direction:column}

  .chip{padding:13px 18px;border-radius:999px;font-size:16px;cursor:pointer;border:1px solid #303030;background:#161616;color:#cfcfcf;
        -webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s,color .12s}
  .chip-on{border-color:#f97316;background:#1d1309;color:#fb923c}

  .btn{display:flex;align-items:center;justify-content:center;height:60px;background:#4f46e5;border-radius:12px;cursor:pointer;
       -webkit-tap-highlight-color:transparent;transition:opacity .12s,transform .06s}
  .btn:active{transform:scale(.985)}
  .btn-ghost{display:flex;align-items:center;justify-content:center;height:52px;border:1px solid #3d3d3d;border-radius:12px;cursor:pointer;
             -webkit-tap-highlight-color:transparent}

  .svar{display:flex;align-items:center;padding:19px 20px;background:#111;border:1px solid #303030;border-radius:12px;
        font-size:17px;color:#ededed;cursor:pointer;line-height:1.35;
        -webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s}
  .svar:active{border-color:#4f46e5;background:#141428}
  /* Valgt aktivitet. Oransje som brikkene, så «valgt» ser likt ut i hele flyten. */
  .svar-on{border-color:#f97316;background:#1d1309;color:#fb923c}
  .btn-av{background:#1c1c1c;cursor:default}

  /* Samtaleformen. Gjenkjennelig som en chat, men i standens eget språk —
     ikke en kopi av et bestemt produkt. Poenget er at studenten kjenner igjen
     situasjonen «jeg ber en AI gjøre noe», ikke at det ser ut som ChatGPT. */
  .rad{display:flex;gap:10px;align-items:flex-start}
  .rad-du{justify-content:flex-end}
  .avatar{
    width:30px;height:30px;border-radius:999px;flex-shrink:0;
    background:#1d1309;border:1px solid #f97316;
    display:flex;align-items:center;justify-content:center;
  }
  .boble{padding:13px 15px;border-radius:14px;font-size:16px;line-height:1.45;max-width:84%}
  .boble-ai{background:#141414;border:1px solid #282828;border-top-left-radius:5px;color:#ededed}
  .boble-du{background:#4f46e5;border-top-right-radius:5px;color:#fff}
  /* Meldingene kommer inn etter hverandre, som i en samtale. */
  .inn{animation:inn .28s ease-out both}
  @keyframes inn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.inn{animation:none}}

  /* Sjekklista på lastesiden. Hvert steg fylles inn når det faktisk er målt. */
  .steg{display:flex;gap:11px;align-items:flex-start;padding:11px 0}
  .steg + .steg{border-top:1px solid #1c1c1c}
  .prikk{width:18px;height:18px;border-radius:999px;flex-shrink:0;margin-top:1px;
         display:flex;align-items:center;justify-content:center;font-size:11px}
  .prikk-vent{border:1px solid #303030;color:#3d3d3d}
  .prikk-gaar{border:2px solid #f97316;border-top-color:transparent;animation:snurr .8s linear infinite}
  .prikk-ok{background:#132a19;border:1px solid #4ade80;color:#4ade80}
  @keyframes snurr{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.prikk-gaar{animation:none}}
  .btn-av:active{transform:none}

  .fin{font-size:12.5px;color:#7f7f7f;line-height:1.45}

  /* Framdrift mens begge kallene går. Ubestemt med vilje: vi vet ikke hvor
     lenge en 192k-tokens side tar, og en falsk prosent ville vært et tall vi
     ikke har målt. */
  .skyv{width:40%;animation:skyv 1.5s ease-in-out infinite}
  @keyframes skyv{0%{margin-left:-40%}100%{margin-left:100%}}
  @media (prefers-reduced-motion:reduce){.skyv{animation:none;width:100%;opacity:.5}}

  #app{
    width:100%;max-width:430px;margin:0 auto;
    /* Nøyaktig skjermhøyde, ikke minst. Med min-height vokste #app forbi
       vinduet, og da scrollet hele sida i stedet for at samtalen scrollet
       internt — knappen havnet under folden. */
    height:100%;
    padding:calc(32px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }
  /* Hver skjerm scroller i seg selv hvis den blir for høy. Skjermer som pinner
     en knapp nederst har sitt eget scrollområde inni og treffer aldri denne. */
  #app > div{flex:1;min-height:0;overflow-y:auto}

  textarea::placeholder{color:#5a5a5a}
</style>
</head>
<body>
<div id="app"></div>
<script src="./config.js?v=__VER__"></script>
<script src="./app.js?v=__VER__"></script>
</body>
</html>
