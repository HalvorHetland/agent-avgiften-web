<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent-avgiften — storskjerm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230a0a0a%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2216%22%20r%3D%228%22%20fill%3D%22%23f97316%22%2F%3E%3Ccircle%20cx%3D%2223%22%20cy%3D%2216%22%20r%3D%223%22%20fill%3D%22%234ade80%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:#0a0a0a;color:#ededed;
    font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .disp{font-family:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;letter-spacing:-0.02em}
  .lbl{font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:#6b6b6b;font-weight:600}
  .kol{display:flex;flex-direction:column}

  /* Designet er tegnet for nøyaktig 1920x1080. Vi beholder de målene og
     skalerer hele flata, slik at skjermen ser lik ut på en projektor med
     annen oppløsning uten at noe layout må regnes om. */
  /* #scene er innpakningen og får de skalerte målene; #rot er det som faktisk
     skaleres. Å sette både width og transform på samme element skalerer to
     ganger — flata ble 1333px bred i stedet for 1600. */
  #scene{transform-origin:top left;flex-shrink:0;overflow:hidden}

  #rot{
    width:1920px;height:1080px;padding:56px 64px;
    display:flex;flex-direction:column;gap:34px;background:#0a0a0a;
  }

  .kort{background:#111;border:1px solid #282828;border-radius:16px}
  .stat{flex-grow:1;display:flex;flex-direction:column;gap:6px}
  .stat + .stat{padding-left:30px;border-left:1px solid #282828}
  .statTall{font-size:36px;font-weight:500}
  .statNavn{font-size:17px;color:#9a9a9a}

  /* Tallene teller opp mot nye verdier i stedet for å hoppe. Ren pynt, men
     det er den som gjør at man SER at noen akkurat stilte et spørsmål. */
  .puls{animation:puls .9s ease-out}
  @keyframes puls{0%{color:#fff;text-shadow:0 0 24px currentColor}100%{}}
  @media (prefers-reduced-motion:reduce){.puls{animation:none}}

  #frakoblet{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    padding:10px 20px;background:#1d1309;border:1px solid #fbbf24;border-radius:999px;
    color:#fbbf24;font-size:16px;display:none;z-index:10;
  }
  #frakoblet.vis{display:block}
</style>
</head>
<body>
<div id="frakoblet">Mistet forbindelsen — viser siste kjente tall</div>
<div id="scene"><div id="rot"></div></div>
<script src="./vendor/supabase.js?v=__VER__"></script>
<script src="../config.js?v=__VER__"></script>
<script src="./skjerm.js?v=__VER__"></script>
</body>
</html>
